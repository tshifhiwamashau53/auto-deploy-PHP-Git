# Nginx example for deploy.php

# Place deploy.php at /var/www/hooks/deploy.php and configure this location block (adjust paths and socket):

location = /hooks/deploy {
    include fastcgi_params;
    fastcgi_pass unix:/run/php/php-fpm.sock; # adjust to your php-fpm socket
    fastcgi_param SCRIPT_FILENAME /var/www/hooks/deploy.php;
    # Optional: restrict GitHub webhook IP ranges (update ranges regularly)
    allow 185.199.108.0/22;
    allow 140.82.112.0/20;
    allow 192.30.252.0/22;
    deny all;
}
